<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendidikan & Pekerjaan — SPN Salman ITB Batch 49</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#FBF8F3',
          ink: '#211D17',
          muted: '#79705F',
          hairline: '#E8E1D2',
          gold: {
            50:'#FDF6E9', 100:'#FAEACB', 200:'#F1D48E', 300:'#E6BB57',
            400:'#D5A233', 500:'#C1861A', 600:'#A66F13', 700:'#835710', 800:'#5F3F0C'
          },
          leaf: { 50:'#EEF6EE', 100:'#DBEEDC', 500:'#3F8A4B', 600:'#2F7239', 700:'#245A2C' }
        },
        fontFamily: {
          serif: ['Lora', 'ui-serif', 'Georgia', 'serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
        }
      }
    }
  }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  body { background:#FBF8F3; }
  [x-cloak] { display:none !important; }
  input[type=radio]:checked, input[type=checkbox]:checked { accent-color:#A66F13; }
  ::selection { background:#F1D48E; }
  .field-label { font-weight:600; color:#211D17; font-size:0.875rem; margin-bottom:0.375rem; display:block; }
  .field-input {
    width:100%; background:#fff; border:1px solid #E8E1D2; border-radius:0.65rem;
    padding:0.7rem 0.9rem; font-size:0.925rem; color:#211D17; transition:border-color .15s, box-shadow .15s;
  }
  .field-input:focus { outline:none; border-color:#C1861A; box-shadow:0 0 0 3px #FAEACB; }
  .field-input::placeholder { color:#B3A990; }
  .req { color:#B4432E; }
</style>
</head>
<body class="font-sans text-ink">

<header class="border-b border-hairline bg-cream/80 backdrop-blur sticky top-0 z-30">
  <div class="max-w-3xl mx-auto px-5 sm:px-6 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gold-600 text-white flex items-center justify-center font-serif font-semibold text-sm">SP</div>
      <div class="leading-tight">
        <p class="font-serif font-semibold text-ink text-[15px]">SPN Salman 49</p>
        <p class="text-[11px] text-muted -mt-0.5">Sekolah Pranikah ITB</p>
      </div>
    </a>
    <a href="index.html" class="text-sm text-muted hover:text-gold-700 transition-colors">← Beranda</a>
  </div>
</header>

<main class="max-w-3xl mx-auto px-5 sm:px-6 py-10 sm:py-14">
  
  <div class="flex items-center gap-1 sm:gap-2 mb-8">
    <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border flex items-center justify-center text-[11px] sm:text-xs font-semibold shrink-0 bg-gold-600 border-gold-600 text-white">✓</div><div class="flex-1 h-px bg-gold-600"></div><div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border flex items-center justify-center text-[11px] sm:text-xs font-semibold shrink-0 bg-gold-600 border-gold-600 text-white">✓</div><div class="flex-1 h-px bg-gold-600"></div><div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border flex items-center justify-center text-[11px] sm:text-xs font-semibold shrink-0 bg-gold-600 border-gold-600 text-white ring-4 ring-gold-100">3</div><div class="flex-1 h-px bg-hairline"></div><div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border flex items-center justify-center text-[11px] sm:text-xs font-semibold shrink-0 bg-white border-hairline text-muted">4</div><div class="flex-1 h-px bg-hairline"></div><div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border flex items-center justify-center text-[11px] sm:text-xs font-semibold shrink-0 bg-white border-hairline text-muted">5</div><div class="flex-1 h-px bg-hairline"></div><div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border flex items-center justify-center text-[11px] sm:text-xs font-semibold shrink-0 bg-white border-hairline text-muted">6</div>
  </div>

  <div class="bg-white border border-hairline rounded-2xl shadow-sm shadow-black/[0.03] p-6 sm:p-9" x-data="{
  q:{}, prev:['restu', 'gambaran_awal', 'alasan', 'harapan', 'nama_lengkap', 'nama_gelar', 'nama_panggilan', 'jenis_kelamin', 'whatsapp', 'instagram', 'tanggal_lahir', 'usia', 'asal_daerah', 'domisili', 'status_pernikahan'],
  pendidikan:'', status_diri:'', pekerjaan:'', jabatan:'', instansi:'', lokasi_kerja:'',
  universitas:'', jurusan:'', angkatan:'',
  init(){
    this.q = Object.fromEntries(new URLSearchParams(location.search));
    this.pendidikan = this.q.pendidikan || '';
    this.status_diri = this.q.status_diri || '';
    this.pekerjaan = this.q.pekerjaan || '';
    this.jabatan = this.q.jabatan || '';
    this.instansi = this.q.instansi || '';
    this.lokasi_kerja = this.q.lokasi_kerja || '';
    this.universitas = this.q.universitas || '';
    this.jurusan = this.q.jurusan || '';
    this.angkatan = this.q.angkatan || '';
  },
  get isMahasiswa(){ return this.status_diri === 'mahasiswa'; },
  get valid(){
    const base = this.pendidikan && this.status_diri && this.pekerjaan && this.jabatan && this.instansi && this.lokasi_kerja;
    if(!base) return false;
    if(this.isMahasiswa) return this.universitas && this.jurusan && this.angkatan;
    return true;
  }
}" x-cloak>
    <div class="mb-7">
      <h1 class="font-serif text-2xl sm:text-[26px] text-ink font-semibold">Pendaftaran SPN Batch 49</h1>
      <p class="text-sm text-muted mt-1">Langkah 3/6: Pendidikan & Pekerjaan</p>
    </div>

    <form method="GET" action="langkah-4.html" class="space-y-6">
      <template x-for="f in prev" :key="f">
      <input type="hidden" :name="f" :value="q[f] || ''">
    </template>
      <p class="text-[15px] text-ink/80">Lengkapi informasi pendidikan dan pekerjaan Anda.</p>

      <div>
        <label class="field-label" for="pdd">Pendidikan Terakhir <span class="req">*</span></label>
        <select id="pdd" name="pendidikan" x-model="pendidikan" class="field-input">
        <option value="">Pilih pendidikan terakhir</option>
<option value="sma">SMA/SMK Sederajat</option>
<option value="d3">Diploma (D1-D3)</option>
<option value="s1">Sarjana (S1) / D4</option>
<option value="s2">Magister (S2)</option>
<option value="s3">Doktor (S3)</option>
      </select>
      </div>
      <div>
        <label class="field-label" for="sd">Status Diri <span class="req">*</span></label>
        <select id="sd" name="status_diri" x-model="status_diri" class="field-input">
        <option value="">Pilih status diri</option>
<option value="mahasiswa">Mahasiswa ITB</option>
<option value="karyawan">Karyawan/Tenaga Kependidikan ITB</option>
<option value="dosen">Dosen ITB</option>
<option value="alumni">Alumni ITB</option>
<option value="umum">Umum (Non-ITB)</option>
      </select>
      </div>
      <div>
        <label class="field-label" for="pk">Pekerjaan (Profesi) <span class="req">*</span></label>
        <input id="pk" name="pekerjaan" x-model="pekerjaan" class="field-input" placeholder="Contoh: Mahasiswa, Guru, Software Engineer">
      </div>
      <div>
        <label class="field-label" for="jb">Nama Jabatan atau Kedudukan <span class="req">*</span></label>
        <input id="jb" name="jabatan" x-model="jabatan" class="field-input" placeholder="Contoh: Staf, Ketua Divisi">
      </div>
      <div>
        <label class="field-label" for="ins">Instansi Tempat Bekerja <span class="req">*</span></label>
        <input id="ins" name="instansi" x-model="instansi" class="field-input" placeholder="Nama instansi/perusahaan">
      </div>
      <div>
        <label class="field-label" for="lk">Lokasi Tempat Kerja <span class="req">*</span></label>
        <input id="lk" name="lokasi_kerja" x-model="lokasi_kerja" class="field-input" placeholder="Kota tempat bekerja">
      </div>

      <div class="border-t border-hairline pt-6" x-show="isMahasiswa" x-transition x-cloak>
        <p class="flex items-center gap-2 text-sm font-semibold text-ink mb-4">
          <span>🎓</span> Untuk Mahasiswa
        </p>
        <div class="space-y-6">
          <div>
            <label class="field-label" for="uni">Asal Universitas <span class="req">*</span></label>
            <select id="uni" name="universitas" x-model="universitas" class="field-input">
        <option value="">Pilih universitas</option>
<option value="itb">Institut Teknologi Bandung / ITB</option>
<option value="unpad">Universitas Padjadjaran / UNPAD</option>
<option value="upi">Universitas Pendidikan Indonesia / UPI</option>
<option value="itenas">Institut Teknologi Nasional / ITENAS</option>
<option value="polban">Politeknik Negeri Bandung / POLBAN</option>
<option value="lainnya">Universitas lainnya</option>
      </select>
          </div>
          <div>
            <label class="field-label" for="jur">Jurusan/Program Studi <span class="req">*</span></label>
            <input id="jur" name="jurusan" x-model="jurusan" class="field-input" placeholder="Contoh: Teknik Informatika">
          </div>
          <div>
            <label class="field-label" for="ang">Angkatan (Tahun Masuk Kuliah) <span class="req">*</span></label>
            <input id="ang" name="angkatan" x-model="angkatan" class="field-input" placeholder="Contoh: 2020">
          </div>
        </div>
      </div>

      
    <div class="flex items-center justify-between border-t border-hairline pt-6 mt-8">
      <button type="button" @click="history.back()" class="text-sm font-medium text-muted hover:text-ink transition-colors">Kembali</button>
      <button type="submit" :disabled="!(valid)"
        :class="(valid) ? 'bg-gold-600 hover:bg-gold-700 text-white cursor-pointer' : 'bg-gold-100 text-gold-400 cursor-not-allowed'"
        class="rounded-xl px-6 py-2.5 text-sm font-semibold transition-colors">Selanjutnya</button>
    </div>

    </form>

  </div>
  <p class="text-center text-xs text-muted mt-6">Sekolah Pranikah Salman ITB · Batch 49</p>
</main>

</body>
</html>
