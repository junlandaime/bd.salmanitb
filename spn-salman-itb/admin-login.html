<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Masuk — SPN Salman ITB Batch 49</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#FBF8F3',
          ink: '#211D17',
          muted: '#79705F',
          hairline: '#E8E1D2',
          gold: {
            50:'#FDF6E9', 100:'#FAEACB', 200:'#F1D48E', 300:'#E6BB57',
            400:'#D5A233', 500:'#C1861A', 600:'#A66F13', 700:'#835710', 800:'#5F3F0C'
          },
          leaf: { 50:'#EEF6EE', 100:'#DBEEDC', 500:'#3F8A4B', 600:'#2F7239', 700:'#245A2C' }
        },
        fontFamily: {
          serif: ['Lora', 'ui-serif', 'Georgia', 'serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
        }
      }
    }
  }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  body { background:#FBF8F3; }
  [x-cloak] { display:none !important; }
  input[type=radio]:checked, input[type=checkbox]:checked { accent-color:#A66F13; }
  ::selection { background:#F1D48E; }
  .field-label { font-weight:600; color:#211D17; font-size:0.875rem; margin-bottom:0.375rem; display:block; }
  .field-input {
    width:100%; background:#fff; border:1px solid #E8E1D2; border-radius:0.65rem;
    padding:0.7rem 0.9rem; font-size:0.925rem; color:#211D17; transition:border-color .15s, box-shadow .15s;
  }
  .field-input:focus { outline:none; border-color:#C1861A; box-shadow:0 0 0 3px #FAEACB; }
  .field-input::placeholder { color:#B3A990; }
  .req { color:#B4432E; }
</style>
</head>
<body class="font-sans text-ink">

<header class="border-b border-hairline bg-cream/80 backdrop-blur sticky top-0 z-30">
  <div class="max-w-3xl mx-auto px-5 sm:px-6 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gold-600 text-white flex items-center justify-center font-serif font-semibold text-sm">SP</div>
      <div class="leading-tight">
        <p class="font-serif font-semibold text-ink text-[15px]">SPN Salman 49</p>
        <p class="text-[11px] text-muted -mt-0.5">Sekolah Pranikah ITB</p>
      </div>
    </a>
    <a href="index.html" class="text-sm text-muted hover:text-gold-700 transition-colors">← Beranda</a>
  </div>
</header>

<main class="max-w-sm mx-auto px-5 sm:px-6 py-16 sm:py-24">
  <div class="bg-white border border-hairline rounded-2xl shadow-sm shadow-black/[0.03] p-7"
       x-data="{ u:'', p:'' }">
    <h1 class="font-serif text-xl font-semibold text-ink text-center">Admin Panel</h1>
    <p class="text-sm text-muted text-center mt-1 mb-6">SPN Salman ITB Batch 49</p>
    <form @submit.prevent="window.location.href='admin-dashboard.html'" class="space-y-4">
      <div>
        <label class="field-label" for="u">Username</label>
        <input id="u" x-model="u" class="field-input" placeholder="admin">
      </div>
      <div>
        <label class="field-label" for="p">Password</label>
        <input id="p" type="password" x-model="p" class="field-input" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-gold-600 hover:bg-gold-700 text-white rounded-xl px-6 py-2.5 text-sm font-semibold transition-colors">Masuk</button>
    </form>
    <p class="text-xs text-muted text-center mt-5">Halaman demo tampilan — belum terhubung ke server sungguhan.</p>
  </div>
</main>

</body>
</html>
